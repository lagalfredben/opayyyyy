<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blank Color Page</title>
    <style>
        body {
            background-color: #1dcf9f; /* Change this to your preferred color */
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>

	
    <style>
       dialog {
  border: none;
  border-radius: 12px;
  padding: 24px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

dialog[open] {
  opacity: 1;
  transform: translateY(0);
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.6);
}

/* Form element scaling for mobile touch targets */
dialog input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px; /* Prevents auto-zoom on iOS */
}

.submit-btn {
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

.close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
    </style>


                  
        <body>          
    
   <dialog id="autoPopup">
  <form method="dialog">
    <button type="button" class="close-btn" onclick="closePopup()">X</button>
    <h2>Join Our Newsletter</h2>
    <p>Get the latest updates straight to your inbox.</p>
    
    <input type="email" placeholder="Enter your email" required />
    <button type="submit" class="submit-btn">Subscribe</option>
  </form>
</dialog>


			
   
    <script>
       window.addEventListener("DOMContentLoaded", () => {
  const popup = document.getElementById("autoPopup");
  // Automatically show popup after 2 seconds (2000 milliseconds)
  setTimeout(() => {
    if (popup && !popup.open) {
      popup.showModal();
    }
  }, 2000);
});

function closePopup() {
  const popup = document.getElementById("autoPopup");
  popup.close();
}
    </script>

</body>  

</html>
