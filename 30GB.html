<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blank Color Page</title>
    <style>
        body {
            background-color: #1dcf9f; /* Change this to your preferred color */
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>

	
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        /* The Dark Background Overlay */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Semi-transparent black */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none; /* Disables interaction when hidden */
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        /* The Pop-Up Box Container */
        .popup-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            transform: translateY(-50px);
            transition: transform 0.4s ease;
        }

        /* Open State Modifier Class */
        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto; /* Re-enables interaction when visible */
        }

        .popup-overlay.active .popup-box {
            transform: translateY(0);
        }

        /* Form Text Formatting */
        .popup-box h2 {
            margin-top: 0;
            color: #333;
        }

        .popup-box p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Input and Button Styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        /* Close Corner Button (X) */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #333;
        }
    </style>


                  
        <body>          
    
    <!-- POPUP STRUCTURE -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <!-- Close Button -->
            <button class="close-btn" id="closeBtn">&times;</button>
            
            <!-- Form Elements -->
            <h2>Join Our Newsletter</h2>
            <center><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXptTlxWQ_OEnoEVMkSVpx2aPHXedBb7vtD6Ca6pJjYA&s=10" alt="SHELL" width="100%" height="35%">
            
            <form action="https://tecnewsrock.blogspot.com/" method="POST">
                <div class="form-group">
                    <input type="text" name="username" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="useremail" placeholder="Your Email Address" required>
                </div>
                <button type="submit" class="submit-btn">Claim Now</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const popupOverlay = document.getElementById('popupOverlay');
        const closeBtn = document.getElementById('closeBtn');

        // Trigger the popup 3000ms (3 seconds) after the page loads
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                popupOverlay.classList.add('active');
            }, 3000); 
        });

        // Function to close the popup
        function closePopup() {
            popupOverlay.classList.remove('active');
        }

        // Close on clicking the "X" button
        closeBtn.addEventListener('click', closePopup);

        // Close on clicking outside the white box (on the shaded background overlay)
        popupOverlay.addEventListener('click', (event) => {
            if (event.target === popupOverlay) {
                closePopup();
            }
        });
    </script>

</body>  

</html>
